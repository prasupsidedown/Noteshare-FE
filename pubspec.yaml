name: noteshare_flutter
description: "NoteShare App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.0.0
  http: ^1.2.0
  http_parser: ^4.0.2
  mime: ^1.0.4

  # Storage
  shared_preferences: ^2.2.3

  # File & Camera
  file_picker: ^8.0.0
  image_picker: ^1.0.0
  camera: ^0.11.1

  # Utilities
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

